name: ci

on:
  push:
    branches: [main]
    tags: ["v*", "*/v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # One job per module and Go version, each with GOWORK=off as consumers
  # build the released modules. vet and test run on both versions; lint,
  # tidy and verify once on the minimum version, govulncheck once on the
  # latest standard library.
  module:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", ginsrvr, fibersrvr, otelsrvr, otelsetup, internal/paritytest]
        go: ["1.27", stable]
    name: ${{ matrix.module }} (go ${{ matrix.go }})
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: vet
        run: make vet MODULES=${{ matrix.module }}
      - name: lint
        if: matrix.go == '1.27'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
      - name: test
        run: make test MODULES=${{ matrix.module }}
      - name: go mod tidy -diff
        if: matrix.go == '1.27'
        run: make tidy-check MODULES=${{ matrix.module }}
      - name: go mod verify
        if: matrix.go == '1.27'
        run: make verify MODULES=${{ matrix.module }}
      - name: govulncheck
        if: matrix.go == 'stable'
        run: make vulncheck MODULES=${{ matrix.module }}

  # Coverage of every package, the internal packages included, from the tests
  # of every module: workspace mode, so -coverpkg spans the modules.
  coverage:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: cover
        run: make cover

  # Allocation regression gate (docs/PERFORMANCE.md): the pull request's
  # base and head are benchmarked one after the other in this job, on one
  # runner, and compared. benchstat's table goes to the job summary;
  # benchgate fails the job when a benchmark's allocs/op or B/op rises more
  # than 10%. Timings are reported and never gate: shared runners vary too
  # much. -benchtime is short because allocation counts are averages over
  # thousands of iterations; -count=6 (make bench) gives benchgate medians.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCH_FLAGS: -benchtime=200ms
    steps:
      - uses: actions/checkout@v7
        with:
          path: branch
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: branch/go.mod
          cache-dependency-path: branch/**/go.sum
      # The branch's Makefile runs in the base tree, so a base without the
      # bench target, or without a module the branch adds, still works.
      - name: benchmark main
        run: make -C main -f "$GITHUB_WORKSPACE/branch/Makefile" bench BENCH_DIR="$RUNNER_TEMP/bench/main"
      - name: benchmark the branch
        run: make -C branch bench BENCH_DIR="$RUNNER_TEMP/bench/branch"
      - name: benchstat
        run: |
          cat "$RUNNER_TEMP"/bench/main/*.txt > "$RUNNER_TEMP/main.txt"
          cat "$RUNNER_TEMP"/bench/branch/*.txt > "$RUNNER_TEMP/branch.txt"
          {
            echo '```'
            go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e \
              main="$RUNNER_TEMP/main.txt" branch="$RUNNER_TEMP/branch.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The gate's report also goes to the job summary, so a unit reported
      # as noisy (not gated) is seen next to benchstat's table.
      - name: allocation gate
        working-directory: branch
        env:
          GOWORK: "off"
        run: |
          status=0
          go run ./internal/benchgate "$RUNNER_TEMP/main.txt" "$RUNNER_TEMP/branch.txt" > "$RUNNER_TEMP/gate.txt" || status=$?
          cat "$RUNNER_TEMP/gate.txt"
          { echo '```'; cat "$RUNNER_TEMP/gate.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # A released module must not keep a replace directive: go ignores replace
  # in a dependency, so consumers would build against another core.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no replace in the tagged module
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dir=.
          case "$TAG" in */v*) dir="${TAG%/v*}" ;; esac
          if grep -nE '^[[:space:]]*replace\b|=>' "$dir/go.mod"; then
            echo "::error file=$dir/go.mod::$TAG: go.mod still has a replace directive"
            exit 1
          fi
